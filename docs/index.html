<style>
/* ==========================================================================
   Agriculture Jobs — modern, professional, easy to scan.

   The information design stays plain (tabs with counts, one meta line per
   card, at most four badges); this layer adds contemporary polish: a glass
   sticky header, soft elevation with hover lift, one blue-to-teal gradient
   reserved for the brand and primary action, and a score ring per job.

   Every colour pair used for text clears WCAG AA at the size it is used —
   the gradient stops were checked against their button text in both themes.
   Status colours stay separate from the accent so a state never reads as
   "selected", and vice versa.
   ========================================================================== */
:root{
  color-scheme: light;
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --surface-2:#F0F0ED;
  --border:#E3E3DF;
  --border-strong:#CFCFC8;
  --text:#1A1A17;
  --text-2:#57574F;
  --text-3:#6E6E65;
  --accent:#2A6496;
  --accent-weak:#EDF3F8;
  --good:#126B33;
  --good-weak:#E9F5ED;
  --warn:#A15C07;
  --tile-ca-ink:#B3261E;
  --tile-tt-ink:#5B50C0;
  --tile-gov-ink:#8F5E12;
  --grad-a:#2A6496;          /* brand + primary action only */
  --grad-b:#0E7490;
  --glass:rgba(255,255,255,.85);
  --wash-1:rgba(42,100,150,.09);   /* decorative page-top washes */
  --wash-2:rgba(14,116,144,.07);
  --shadow-sm:0 1px 2px rgba(20,22,20,.05),0 1px 3px rgba(20,22,20,.06);
  --shadow-md:0 2px 4px rgba(20,22,20,.05),0 8px 20px -6px rgba(20,22,20,.13);
  --radius:12px;
  --radius-sm:10px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141513;
    --surface:#1C1D1A;
    --surface-2:#24251F;
    --border:#2E302B;
    --border-strong:#3E4038;
    --text:#EDEDE8;
    --text-2:#A8A99F;
    --text-3:#8A8B81;
    --accent:#7FB3DC;
    --accent-weak:#1B2831;
    --good:#4ADE80;
    --good-weak:#16241B;
    --warn:#E0A33E;
    --tile-ca-ink:#EF8A80;
    --tile-tt-ink:#ACA4F2;
    --tile-gov-ink:#E0A33E;
    --grad-a:#7FB3DC;
    --grad-b:#5BC0CE;
    --glass:rgba(25,29,26,.85);
    --wash-1:rgba(127,179,220,.08);
    --wash-2:rgba(91,192,206,.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 2px 4px rgba(0,0,0,.3),0 10px 24px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#141513;
  --surface:#1C1D1A;
  --surface-2:#24251F;
  --border:#2E302B;
  --border-strong:#3E4038;
  --text:#EDEDE8;
  --text-2:#A8A99F;
  --text-3:#8A8B81;
  --accent:#7FB3DC;
  --accent-weak:#1B2831;
  --good:#4ADE80;
  --good-weak:#16241B;
  --warn:#E0A33E;
  --tile-ca-ink:#EF8A80;
  --tile-tt-ink:#ACA4F2;
  --tile-gov-ink:#E0A33E;
  --grad-a:#7FB3DC;
  --grad-b:#5BC0CE;
  --glass:rgba(25,29,26,.85);
  --wash-1:rgba(127,179,220,.08);
  --wash-2:rgba(91,192,206,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 2px 4px rgba(0,0,0,.3),0 10px 24px -8px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--text);
  background-color:var(--bg);
  /* two soft washes at the top of the page — decorative only */
  background-image:
    radial-gradient(560px 300px at 12% -60px,var(--wash-1),transparent 62%),
    radial-gradient(520px 280px at 88% -80px,var(--wash-2),transparent 62%);
  background-repeat:no-repeat;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.filled{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.page{max-width:1120px;margin:0 auto;padding:0 24px}
.spacer{flex:1}

/* entrance — one quiet page-load sequence, disabled for reduced motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero-in{animation:rise .5s ease both}
.summary{animation:rise .5s .06s ease both}
.insights{animation:rise .5s .1s ease both}
.tabs{animation:rise .5s .14s ease both}
.toolbar,.list{animation:rise .5s .18s ease both}

/* ---------------------------------------------------------------- header */
.header{
  position:sticky;top:0;z-index:30;
  background:var(--glass);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid var(--border);
}
.header-in{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;flex-shrink:0}
/* Wordmark instead of a logo tile: "Agriculture" in ink, "Jobs" carrying the
   brand gradient as clipped text. Both gradient stops clear 4.5:1 on the
   glass header in both themes (5.31 light, 7.65 dark at worst); a solid
   accent colour stands in where background-clip:text is unsupported. */
.wordmark{font-size:17px;font-weight:700;letter-spacing:-.028em;line-height:1;
  display:inline-flex;align-items:baseline;gap:5px}
.wordmark b{font-weight:700;color:var(--accent)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .wordmark b{background:linear-gradient(120deg,var(--grad-a),var(--grad-b));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent}
}
.header-tools{display:flex;align-items:center;gap:8px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
  color:var(--text-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex-shrink:0}
.dot.off{background:var(--text-3)}
.dot.busy{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);font-size:13.5px;font-weight:550;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}
.btn:hover{background:var(--surface-2)}
/* The gradient is reserved for the one primary action; its text is --bg so
   it flips with the theme (checked ≥ 4.99:1 on both stops, both themes). */
.btn-primary{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  border-color:transparent;color:var(--bg);box-shadow:var(--shadow-sm)}
.btn-primary:hover{filter:brightness(1.06);box-shadow:var(--shadow-md)}
.btn-primary:disabled{opacity:.55;cursor:default;filter:none;box-shadow:none}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:2px;background:transparent}
.progress span{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--grad-a),var(--grad-b));transition:width .3s}

/* ------------------------------------------------------------------ hero */
/* A deliberate dark panel in both themes. Its ink is fixed light-on-dark
   and was verified against every gradient stop, including the regions lit
   by the dot pattern and the teal glow: h1 6.75:1, subtitle 4.84:1,
   eyebrow 5.14:1 at worst. */
.hero{background:linear-gradient(140deg,#1E3A4F 0%,#123E44 55%,#0F4A4C 100%);
  border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:22px 22px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 75%);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 75%)}
.hero::after{content:"";position:absolute;right:-10%;top:-60%;width:55%;height:200%;
  background:radial-gradient(closest-side,rgba(94,196,206,.18),transparent 70%);
  pointer-events:none}
/* Longhand only: the shorthand was zeroing .page's horizontal padding,
   pinning the hero text to the viewport edge. */
.hero-in{position:relative;z-index:1;padding-top:52px;padding-bottom:78px}
.hero-eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:#C6DEE2}
.hero-in h1{margin-top:10px;font-size:clamp(32px,4.6vw,46px);font-weight:700;
  letter-spacing:-.032em;line-height:1.12;color:#F4F8F6;text-wrap:balance}
.hero-sub{margin-top:12px;font-size:15.5px;line-height:1.6;max-width:62ch;color:#C9D6D6}

/* Summary tiles — overlap the hero, an icon and a number each. */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));
  gap:12px;margin-top:-46px;position:relative;z-index:2}
/* No iconography here: each tile is a large number in its own hue over a
   short colour rule. Number inks were checked on the surface in both themes
   (5.56:1 at worst; 29px bold needs only 3:1). The rule is decorative. */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 17px 14px;box-shadow:var(--shadow-md)}
.card b{display:block;font-size:29px;font-weight:680;letter-spacing:-.032em;
  line-height:1.05;color:var(--tone,var(--text))}
.card .rule{display:block;width:26px;height:3px;border-radius:2px;
  background:var(--tone,var(--accent));margin:8px 0 9px}
.card span{display:block;font-size:12.5px;color:var(--text-2)}
.tone-ca{--tone:var(--tile-ca-ink)}
.tone-tt{--tone:var(--tile-tt-ink)}
.tone-fac{--tone:var(--accent)}
.tone-gov{--tone:var(--tile-gov-ink)}
.tone-new{--tone:var(--good)}

/* -------------------------------------------------------------- insights */
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:12px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.panel h3{font-size:13.5px;font-weight:630;display:flex;align-items:center;gap:8px}
.panel h3 .ic{width:15px;height:15px;color:var(--text-3)}
.panel .hint{font-size:12px;color:var(--text-3);margin-top:2px;margin-bottom:13px}
.rows{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:10px;font-size:12.5px}
.rlabel{color:var(--text-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow.pin .rlabel{color:var(--accent);font-weight:620}
/* Both are spans: without display:block the fill stays inline and its
   width/height are ignored, which left the bars invisible. */
.rtrack{display:block;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.rfill{display:block;height:100%;border-radius:4px;background:var(--accent);min-width:2px;transition:width .5s ease}
.rval{font-size:12px;color:var(--text);text-align:right}
.sparkline{width:100%;height:72px;display:block;overflow:visible}
.spark-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:6px}

/* ------------------------------------------------------------- spotlight */
/* The single best job right now, pinned above the list with a gradient
   border: surface fill in padding-box, gradient in border-box. */
.job.spotlight{border:1.5px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(135deg,var(--grad-a),var(--grad-b)) border-box;
  box-shadow:var(--shadow-md)}
.badge.top{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  border-color:transparent;color:var(--bg);font-weight:640}

/* ------------------------------------------------------------------ tabs */
.tabs{display:flex;gap:6px;margin-top:30px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:550;
  color:var(--text-2);border:1px solid transparent;white-space:nowrap;
  transition:background .14s,color .14s,border-color .14s,box-shadow .14s}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:var(--surface);border-color:var(--border);
  color:var(--accent);font-weight:630;box-shadow:var(--shadow-sm)}
.tab .count{margin-left:6px;font-size:12px;color:var(--text-3)}
.tab.active .count{color:var(--accent)}

/* --------------------------------------------------------------- toolbar */
.toolbar{display:flex;align-items:center;gap:10px;padding:18px 0 14px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:400px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search input{width:100%;padding:9px 12px 9px 35px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--surface);font-size:14px;outline:none;
  transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
select{padding:9px 30px 9px 11px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background-color:var(--surface);font-size:13.5px;
  outline:none;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E6E65' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9.5l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:14px;
  transition:border-color .15s,box-shadow .15s}
select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}

/* Advanced filters stay closed until asked for; the tabs cover most needs. */
.filters{display:none;gap:14px;flex-wrap:wrap;align-items:flex-end;
  padding:16px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow-sm)}
.filters.open{display:flex}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--text-2);font-weight:550}
.range{display:flex;align-items:center;gap:9px}
.range output{font-size:14px;font-weight:620;min-width:26px}
input[type=range]{width:130px;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--border-strong)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--accent);margin-top:-6px;
  border:2.5px solid var(--surface);box-shadow:var(--shadow-sm)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--border-strong)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2.5px solid var(--surface)}

.applied{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.applied:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 7px 4px 10px;
  border:1px solid var(--border-strong);border-radius:99px;background:var(--surface);
  font-size:12.5px;color:var(--text-2);box-shadow:var(--shadow-sm)}
.pill button{display:grid;place-items:center;color:var(--text-3)}
.pill button:hover{color:var(--text)}
.pill .ic{width:11px;height:11px;stroke-width:2.4}

/* ------------------------------------------------------------------ list */
.count-line{font-size:13.5px;color:var(--text-2);margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:10px}
.job{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;
  gap:18px;align-items:start;box-shadow:var(--shadow-sm);
  transition:border-color .15s,box-shadow .15s,transform .15s}
.job:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);
  transform:translateY(-1px)}
.job.is-applied{opacity:.55}

/* Score ring — track in a neutral, fill in the accent; green when strong. */
.score{position:relative;width:52px;height:52px}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring-track{fill:none;stroke:var(--surface-2);stroke-width:4}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;
  transition:stroke-dashoffset .6s ease}
.score b{position:absolute;inset:0;display:grid;place-items:center;
  font-size:14.5px;font-weight:660;letter-spacing:-.02em}
.score.strong .ring-fill{stroke:var(--good)}
.score.strong b{color:var(--good)}
/* Each list row is a fixed gutter plus the card, so the flag sits OUTSIDE
   the card on its left, roughly level with the score ring. Decorative — the
   country is named in the card text — so it is aria-hidden with a tooltip.
   The gutter keeps its width when a country has no flag, so cards align. */
.job-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.flag-slot{display:block;padding-top:26px}
.flag-slot .flag{display:block;width:28px;height:21px;object-fit:cover;border-radius:3.5px;
  box-shadow:0 0 0 1px rgba(20,22,20,.16),0 1px 2px rgba(20,22,20,.12)}

.job h2{font-size:16px;font-weight:620;letter-spacing:-.015em;line-height:1.35;display:inline}
.job h2 a:hover{color:var(--accent)}
.org{font-size:14px;color:var(--text-2);margin-top:4px}
.org b{font-weight:600;color:var(--text)}
/* One quiet line of context keeps the card scannable. */
.meta{font-size:13px;color:var(--text-3);margin-top:6px}
.meta .sep{opacity:.6;margin:0 6px}

/* Only badges that change a decision. */
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.badge{font-size:12px;padding:2.5px 9px;border-radius:99px;border:1px solid;font-weight:560}
.badge.canada{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.badge.match{background:var(--good-weak);border-color:var(--good);color:var(--good)}
.badge.fresh{background:transparent;border-color:var(--good);color:var(--good)}
.badge.gov{background:transparent;border-color:var(--warn);color:var(--warn)}
.badge.disc{background:transparent;border-color:var(--tile-tt-ink);color:var(--tile-tt-ink)}

.details-btn{font-size:13px;color:var(--text-2);margin-top:10px;
  display:inline-flex;align-items:center;gap:5px}
.details-btn:hover{color:var(--accent)}
.details-btn .ic{width:13px;height:13px;transition:transform .2s}
.job.open .details-btn .ic{transform:rotate(180deg)}
.details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.job.open .details{display:block}
.details p{font-size:13.5px;color:var(--text-2);line-height:1.6}
.terms{margin-top:10px;font-size:13px;color:var(--text-2)}
.terms div+div{margin-top:5px}
.terms b{font-weight:600;color:var(--text);margin-right:6px}

.actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);color:var(--text-3);background:var(--surface);
  transition:color .14s,border-color .14s}
.icon-btn:hover{color:var(--text)}
.icon-btn.on{color:var(--warn);border-color:var(--warn)}
.icon-btn.done{color:var(--good);border-color:var(--good)}
/* Fit / Not-a-fit. A "not a fit" verdict hides the posting and teaches the
   ranker; both are reversible from the "Not a fit" tab. */
.icon-btn.fit{color:var(--good);border-color:var(--good);background:var(--good-weak)}
.icon-btn.unfit{color:var(--tile-ca-ink);border-color:var(--tile-ca-ink)}
.job.rejected{opacity:.5}
.learn-note{font-size:12.5px;color:var(--text-2);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 14px;margin-bottom:12px;line-height:1.6}
.learn-note:empty{display:none}
.learn-note b{color:var(--text);font-weight:620}

.load-more{width:100%;padding:13px;margin-top:12px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface);font-size:13.5px;
  font-weight:550;color:var(--text-2);box-shadow:var(--shadow-sm);
  transition:background .15s,color .15s}
.load-more:hover{background:var(--surface-2);color:var(--text)}
.empty{text-align:center;padding:64px 24px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.empty .ic{width:28px;height:28px;color:var(--text-3);margin-bottom:12px}
.empty h2{font-size:17px;font-weight:630;margin-bottom:6px}
.empty p{font-size:14px;color:var(--text-2);max-width:42ch;margin:0 auto 16px}
.skeleton{height:96px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);position:relative;overflow:hidden}
.skeleton::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,var(--surface-2),transparent);
  animation:shimmer 1.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.footer{margin-top:48px;padding:22px 0 52px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--text-3);line-height:1.8}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--radius-sm);
  font-size:13.5px;z-index:50;box-shadow:var(--shadow-md);transition:transform .28s}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  .page{padding:0 16px}
  .hero-in{padding-top:34px;padding-bottom:64px}
  .hero-in h1{font-size:28px}
  .job{grid-template-columns:48px minmax(0,1fr);gap:14px}
  .score{width:48px;height:48px}
  .job-row{grid-template-columns:24px minmax(0,1fr);gap:8px}
  .flag-slot{padding-top:22px}
  .flag-slot .flag{width:24px;height:18px}
  .actions{grid-column:1/-1;justify-content:flex-end}
  .status{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="header">
  <div class="page header-in">
    <div class="brand">
      <span class="wordmark">Agriculture<b>Jobs</b></span>
    </div>
    <div class="spacer"></div>
    <div class="header-tools">
      <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">Loading</span></span>
      <button class="btn btn-icon" id="themeBtn" title="Switch theme" aria-label="Switch theme">
        <svg class="ic" viewBox="0 0 24 24"><use id="themeIcon" href="#i-moon"/></svg></button>
      <button class="btn btn-icon" id="exportBtn" title="Download these jobs as CSV" aria-label="Download CSV">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-download"/></svg></button>
      <button class="btn btn-primary" id="refreshBtn">
        <svg class="ic" id="refreshIcon" viewBox="0 0 24 24"><use href="#i-refresh"/></svg>
        <span id="refreshLabel">Refresh</span></button>
    </div>
  </div>
  <div class="progress"><span id="progressBar"></span></div>
</header>

<section class="hero">
  <div class="page hero-in">
    <p class="hero-eyebrow" id="heroEyebrow">Agriculture job radar</p>
    <h1 id="introTitle">Loading jobs…</h1>
    <p id="introText" class="hero-sub"></p>
  </div>
</section>

<main class="page">
  <div class="summary" id="summary"></div>

  <section class="insights" id="insights"></section>

  <nav class="tabs" id="tabs" aria-label="Filter jobs by group"></nav>

  <div class="toolbar">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
      <label class="sr" for="search">Search jobs</label>
      <input type="search" id="search" placeholder="Search job title or institution" autocomplete="off">
    </div>
    <button class="btn" id="filtersBtn" aria-expanded="false" aria-controls="filters">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-sliders"/></svg>More filters</button>
    <div class="spacer"></div>
    <label class="sr" for="sort">Sort by</label>
    <select id="sort">
      <option value="priority">Canada &amp; faculty first</option>
      <option value="score">Best match</option>
      <option value="new">Newest</option>
      <option value="org">Institution A–Z</option>
      <option value="country">Country A–Z</option>
    </select>
  </div>

  <div class="filters" id="filters">
    <div class="field"><label for="fRole">Position type</label><select id="fRole"></select></div>
    <div class="field"><label for="fCountry">Country</label><select id="fCountry"></select></div>
    <div class="field"><label for="fArea">Agriculture area</label><select id="fArea"></select></div>
    <div class="field"><label for="fSource">Source</label><select id="fSource"></select></div>
    <div class="field"><label for="fScore">Minimum match</label>
      <div class="range"><input type="range" id="fScore" min="0" max="95" step="5" value="40">
        <output id="scoreValue" for="fScore">40</output></div></div>
    <div class="field"><label>&nbsp;</label><button class="btn" id="resetBtn">Clear all</button></div>
  </div>

  <div class="learn-note" id="learnNote"></div>
  <div class="applied" id="appliedFilters"></div>
  <p class="count-line" id="countLine"></p>
  <div class="list" id="list"></div>
  <button class="load-more" id="loadMore" hidden>Show more</button>

  <footer class="footer">
    <div id="footerStats"></div>
    <div>Canada: CAUT · Guelph · Toronto · Ottawa · McGill · UBC · Dalhousie · NRC · Nova Scotia<br>
      Worldwide: jobs.ac.uk · Nature Careers · Times Higher Education · Chronicle ·
      Inside Higher Ed · HigherEdJobs · EURAXESS · jobRxiv</div>
  </footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================================
   Constants and state
   ========================================================================== */
const FACULTY_ROLES = new Set([
  "Tenure-Track Faculty", "Professor / Senior Faculty",
  "Lecturer / Teaching Faculty", "Department Head / Chair"
]);

/** Tabs answer the common questions; "More filters" covers everything else. */
const TABS = [
  { id: "all",     label: "All",          match: () => true },
  { id: "canada",  label: "Canada",       match: job => job.is_priority_country },
  { id: "faculty", label: "Faculty",      match: job => FACULTY_ROLES.has(job.role) },
  { id: "tenure",  label: "Tenure-track", match: job => job.is_tenure_track },
  { id: "tech",    label: "Ag + tech",    match: job => job.synergy },
  { id: "gov",     label: "Government",   match: job => job.is_government },
  { id: "new",     label: "New",          match: job => job.is_new },
  { id: "saved",   label: "Saved",        match: job => state.saved.has(job.id) },
  { id: "notfit",  label: "Not a fit",    match: job => verdictOf(job.id) === "not_fit" }
];

const verdictOf = id => state.feedback[id]?.verdict || null;

const SORTERS = {
  priority: (a, b) => (a.priority ?? 3) - (b.priority ?? 3) || b.score - a.score,
  score:    (a, b) => b.score - a.score,
  new:      (a, b) => (a.age_days ?? 999) - (b.age_days ?? 999) || b.score - a.score,
  org:      (a, b) => (a.org || "~").localeCompare(b.org || "~") || b.score - a.score,
  country:  (a, b) => (a.country || "~").localeCompare(b.country || "~") || b.score - a.score
};

const FILTER_INPUTS = {
  search: "#search", role: "#fRole", country: "#fCountry",
  area: "#fArea", source: "#fSource"
};

const DEFAULT_FILTERS = { search: "", role: "", country: "", area: "", source: "", minScore: 40 };

const state = {
  payload: null,
  jobs: [],
  visible: [],
  tab: "all",
  sort: "priority",
  page: 1,
  perPage: 25,
  isLive: false,
  saved: new Set(),
  applied: new Set(),
  feedback: {},          // id -> { verdict: "fit" | "not_fit", ...job features }
  filters: { ...DEFAULT_FILTERS },
  pollTimer: null,
  toastTimer: null
};

/** Country name -> ISO 3166-1 alpha-2, for the flag under each score ring. */
const COUNTRY_FLAG = {
  "United States": "us", "Canada": "ca", "United Kingdom": "gb", "Australia": "au",
  "New Zealand": "nz", "Ireland": "ie", "Germany": "de", "France": "fr",
  "Netherlands": "nl", "Belgium": "be", "Switzerland": "ch", "Austria": "at",
  "Sweden": "se", "Norway": "no", "Denmark": "dk", "Finland": "fi", "Spain": "es",
  "Italy": "it", "Portugal": "pt", "Poland": "pl", "Czechia": "cz", "Greece": "gr",
  "Hungary": "hu", "Romania": "ro", "Slovakia": "sk", "Slovenia": "si",
  "Croatia": "hr", "Estonia": "ee", "Latvia": "lv", "Lithuania": "lt",
  "Iceland": "is", "Luxembourg": "lu", "Cyprus": "cy", "Malta": "mt",
  "Bulgaria": "bg", "Serbia": "rs", "China": "cn", "Japan": "jp",
  "South Korea": "kr", "Singapore": "sg", "Hong Kong": "hk", "India": "in",
  "Malaysia": "my", "Thailand": "th", "Taiwan": "tw", "Vietnam": "vn",
  "Indonesia": "id", "Philippines": "ph", "Pakistan": "pk", "Bangladesh": "bd",
  "United Arab Emirates": "ae", "Saudi Arabia": "sa", "Qatar": "qa",
  "Kuwait": "kw", "Oman": "om", "Bahrain": "bh", "Israel": "il", "Turkey": "tr",
  "Jordan": "jo", "Lebanon": "lb", "Egypt": "eg", "Morocco": "ma",
  "South Africa": "za", "Kenya": "ke", "Nigeria": "ng", "Ghana": "gh",
  "Ethiopia": "et", "Tanzania": "tz", "Brazil": "br", "Mexico": "mx",
  "Argentina": "ar", "Chile": "cl", "Colombia": "co", "Peru": "pe",
  "Uruguay": "uy", "Costa Rica": "cr", "Jamaica": "jm"
};

/**
 * A small flag image, or "" when the country is unknown. Decorative: the
 * country is already named in the card text, so alt is empty and a failed
 * load removes the element rather than leaving a broken-image box.
 */
function flagHtml(country, cls) {
  const iso = COUNTRY_FLAG[country];
  if (!iso) return "";
  return `<img class="${cls}" src="https://flagcdn.com/w40/${iso}.png"
    srcset="https://flagcdn.com/w80/${iso}.png 2x" width="27" height="20"
    alt="" title="${escapeHtml(country)}" loading="lazy" aria-hidden="true"
    onerror="this.remove()">`;
}

const $ = selector => document.querySelector(selector);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g,
  ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const icon = id => `<svg class="ic" viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const sentenceCase = text => text.replace(/^\w/, ch => ch.toUpperCase());

/* ==========================================================================
   Theme
   ========================================================================== */
function syncThemeIcon() {
  const isDark = document.documentElement.dataset.theme === "dark";
  $("#themeIcon").setAttribute("href", isDark ? "#i-moon" : "#i-sun");
}

function applyStoredTheme() {
  const stored = localStorage.getItem("agjobs-theme");
  document.documentElement.dataset.theme =
    stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  syncThemeIcon();
}

$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("agjobs-theme", next);
  syncThemeIcon();
});

applyStoredTheme();

/* ==========================================================================
   Loading — the local engine if it is running, otherwise the daily snapshot
   ========================================================================== */
async function fetchJobs() {
  try {
    const response = await fetch("/api/jobs", { cache: "no-store" });
    if (response.ok) {
      state.isLive = true;
      return response.json();
    }
  } catch {
    // Engine not running; fall through to the published snapshot.
  }
  const snapshot = await fetch("data/jobs.json", { cache: "no-store" });
  if (!snapshot.ok) throw new Error("No job data available");
  return snapshot.json();
}

async function fetchMarks() {
  if (state.isLive) {
    try {
      const response = await fetch("/api/starred");
      if (response.ok) return response.json();
    } catch {
      // Fall back to whatever this browser has saved.
    }
  }
  try {
    return JSON.parse(localStorage.getItem("agjobs-marks") || "{}");
  } catch {
    return {};
  }
}

async function init() {
  $("#list").innerHTML = '<div class="skeleton"></div>'.repeat(4);
  try {
    state.payload = await fetchJobs();
    const marks = await fetchMarks();
    state.saved = new Set(marks.starred || []);
    state.applied = new Set(marks.applied || []);
    state.feedback = await loadFeedback();
    state.jobs = state.payload.jobs || [];

    if (!state.isLive) {
      const button = $("#refreshBtn");
      button.disabled = true;
      button.title = "This page updates automatically every morning";
      $("#refreshLabel").textContent = "Updated daily";
    }

    setStatus(true);
    buildTabs();
    buildFilterOptions();
    render();

    const stats = state.payload.stats || {};
    $("#footerStats").textContent =
      `${stats.raw_fetched || 0} postings checked · ` +
      `${stats.rejected_non_ag || 0} set aside as not agricultural · ` +
      `${stats.total || 0} kept`;
  } catch {
    setStatus(false);
    showNoData();
  }
}

function setStatus(online) {
  const dot = $("#statusDot");
  const text = $("#statusText");
  if (!online) {
    dot.className = "dot off";
    text.textContent = "No data";
    return;
  }
  dot.className = "dot";
  const when = state.payload?.generated_at ? timeAgo(state.payload.generated_at) : "just now";
  text.textContent = state.isLive ? `Live · updated ${when}` : `Updated ${when}`;
}

function showNoData() {
  $("#list").innerHTML = `<div class="empty">${icon("i-globe")}
    <h2>No jobs to show</h2>
    <p>If you are running this on your own computer, start <b>START-DASHBOARD.bat</b>
       so the search engine can reach the internet.</p></div>`;
  $("#introTitle").textContent = "No jobs to show";
  $("#heroEyebrow").textContent = "Agriculture job radar";
  $("#summary").innerHTML = "";
  $("#insights").innerHTML = "";
}

/* ==========================================================================
   Tabs and filter options
   ========================================================================== */
function buildTabs() {
  $("#tabs").innerHTML = TABS.map(tab => `
    <button class="tab${tab.id === state.tab ? " active" : ""}" data-tab="${tab.id}">
      ${tab.label}<span class="count num" id="count-${tab.id}"></span>
    </button>`).join("");
}

function setActiveTab(id) {
  state.tab = id;
  document.querySelectorAll(".tab").forEach(el =>
    el.classList.toggle("active", el.dataset.tab === id));
}

function buildFilterOptions() {
  const countBy = key => {
    const counts = new Map();
    state.jobs.forEach(job => {
      const value = job[key];
      if (value && value !== "Unspecified") counts.set(value, (counts.get(value) || 0) + 1);
    });
    return [...counts.entries()].sort((a, b) => b[1] - a[1]);
  };

  const areaCounts = new Map();
  state.jobs.forEach(job => (job.ag_areas || []).forEach(area =>
    areaCounts.set(area, (areaCounts.get(area) || 0) + 1)));

  fillSelect("#fRole", countBy("role"), "Any position type");
  fillSelect("#fCountry", countBy("country"), "Any country");
  fillSelect("#fArea", [...areaCounts.entries()].sort((a, b) => b[1] - a[1]), "Any area");
  fillSelect("#fSource", countBy("source"), "Any source");
}

function fillSelect(selector, entries, allLabel) {
  $(selector).innerHTML = `<option value="">${allLabel}</option>` +
    entries.map(([value, count]) =>
      `<option value="${escapeHtml(value)}">${escapeHtml(value)} (${count})</option>`).join("");
}

/* ==========================================================================
   Filtering and sorting
   ========================================================================== */
function matchesFilters(job) {
  const filters = state.filters;
  if (job.score < filters.minScore) return false;
  if (filters.role && job.role !== filters.role) return false;
  if (filters.country && job.country !== filters.country) return false;
  if (filters.source && job.source !== filters.source) return false;
  if (filters.area && !(job.ag_areas || []).includes(filters.area)) return false;
  if (filters.search) {
    const haystack = [job.title, job.org, job.location, job.country,
      (job.match_terms || []).join(" "), job.summary].join(" ").toLowerCase();
    if (!haystack.includes(filters.search.toLowerCase())) return false;
  }
  return true;
}

function computeVisible() {
  const tab = TABS.find(item => item.id === state.tab) || TABS[0];
  // A "not a fit" posting is gone from every view but the one that exists to
  // undo it. The next refresh drops it from the data as well.
  const keep = job => state.tab === "notfit" || verdictOf(job.id) !== "not_fit";
  state.visible = state.jobs.filter(job =>
    keep(job) && tab.match(job) && matchesFilters(job));
  state.visible.sort(SORTERS[state.sort]);
}

/* ==========================================================================
   Rendering
   ========================================================================== */
function render() {
  if (!state.payload) return;
  computeVisible();
  renderTabCounts();
  renderIntro();
  renderInsights();
  renderLearning();
  renderAppliedFilters();
  state.page = 1;
  renderList();
}

function renderTabCounts() {
  TABS.forEach(tab => {
    const el = $(`#count-${tab.id}`);
    if (!el) return;
    const pool = tab.id === "notfit"
      ? state.jobs
      : state.jobs.filter(job => verdictOf(job.id) !== "not_fit");
    el.textContent = pool.filter(tab.match).length;
  });
}

function renderIntro() {
  const jobs = state.jobs;
  const tiles = [
    { tone: "tone-ca", value: jobs.filter(job => job.is_priority_country).length,
      label: "In Canada" },
    { tone: "tone-tt", value: jobs.filter(job => job.is_tenure_track).length,
      label: "Tenure-track" },
    { tone: "tone-fac", value: jobs.filter(job => FACULTY_ROLES.has(job.role)).length,
      label: "Faculty roles" },
    { tone: "tone-gov", value: jobs.filter(job => job.is_government).length,
      label: "Government" },
    { tone: "tone-new", value: jobs.filter(job => job.age_days !== null && job.age_days <= 7).length,
      label: "Added this week" }
  ];

  let when = "";
  if (state.payload?.generated_at) {
    try {
      when = new Date(state.payload.generated_at)
        .toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
    } catch { /* fall back to the generic eyebrow */ }
  }
  $("#heroEyebrow").textContent = when ? `Updated ${when}` : "Updated every morning";
  $("#introTitle").innerHTML =
    `<span class="num" id="heroCount">${jobs.length}</span> agriculture jobs`;
  $("#introText").textContent =
    "Academic and government job boards, checked every day and ranked against your CV.";
  $("#summary").innerHTML = tiles.map(tile => `
    <div class="card ${tile.tone}">
      <b class="num">${tile.value}</b>
      <i class="rule" aria-hidden="true"></i>
      <span>${tile.label}</span>
    </div>`).join("");
  animateCount($("#heroCount"), jobs.length);
}

/** Ease the hero number up once per data load; reduced motion skips it. */
function animateCount(el, target) {
  if (state.counted === target ||
      matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.textContent = target;
    return;
  }
  state.counted = target;
  const started = performance.now(), duration = 700;
  // rAF pauses in background tabs, so a timeout guarantees the final value.
  setTimeout(() => { el.textContent = target; }, duration + 120);
  (function tick(now) {
    const p = Math.min((now - started) / duration, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(started);
}

/** Two compact read-only charts: countries (Canada pinned) and 30-day activity. */
function renderInsights() {
  const jobs = state.jobs;

  const counts = new Map();
  jobs.forEach(job => {
    const c = job.country;
    if (c && c !== "Unspecified") counts.set(c, (counts.get(c) || 0) + 1);
  });
  const rows = [...counts.entries()]
    .sort((a, b) => (b[0] === "Canada") - (a[0] === "Canada") || b[1] - a[1])
    .slice(0, 6);
  const max = Math.max(...rows.map(r => r[1]), 1);

  const days = 30, series = new Array(days).fill(0);
  jobs.forEach(job => {
    const a = job.age_days;
    if (a !== null && a >= 0 && a < days) series[days - 1 - a] += 1;
  });
  const total = series.reduce((x, y) => x + y, 0);
  const w = 300, h = 64, step = w / (days - 1), peak = Math.max(...series, 1);
  const pts = series.map((v, i) => [i * step, h - (v / peak) * (h - 10) - 3]);
  const line = pts.map((pt, i) => `${i ? "L" : "M"}${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];

  $("#insights").innerHTML = `
    <div class="panel">
      <h3>${icon("i-globe")}Where the jobs are</h3>
      <p class="hint">Canada shown first</p>
      <div class="rows">${rows.map(([country, n]) => `
        <div class="rrow${country === "Canada" ? " pin" : ""}">
          <span class="rlabel">${escapeHtml(country)}</span>
          <span class="rtrack"><span class="rfill" style="width:${(n / max * 100).toFixed(1)}%"></span></span>
          <span class="rval num">${n}</span>
        </div>`).join("")}
      </div>
    </div>
    <div class="panel">
      <h3>${icon("i-trend")}Posting activity</h3>
      <p class="hint">New jobs per day, last 30 days</p>
      <svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
           aria-label="${total} new jobs in the last 30 days">
        <path d="${line} L${w} ${h} L0 ${h} Z" fill="var(--accent-weak)"/>
        <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"/>
      </svg>
      <div class="spark-axis"><span>30 days ago</span><span class="num">${total} total</span><span>today</span></div>
    </div>`;
}

/** A plain-language summary of what the ratings have taught the ranker. */
function renderLearning() {
  const note = $("#learnNote");
  const rated = Object.keys(state.feedback).length;
  const learning = state.payload?.stats?.learning;

  if (!rated) { note.innerHTML = ""; return; }
  if (!learning?.ready) {
    note.innerHTML = `<b>${rated} rated.</b> Use the thumbs on each job.
      Once there are a few of both kinds, the ranking starts adapting to them.`;
    return;
  }
  const likes = (learning.likes || []).slice(0, 4).map(escapeHtml).join(", ");
  const dislikes = (learning.dislikes || []).slice(0, 4).map(escapeHtml).join(", ");
  note.innerHTML =
    `<b>Learning from ${learning.ratings} ratings.</b> Scoring leans toward
     ${likes || "-"} and away from ${dislikes || "-"}.`;
}

function renderAppliedFilters() {
  const filters = state.filters;
  const pills = [];
  const add = (label, key) => pills.push(
    `<span class="pill">${escapeHtml(label)}
      <button data-clear="${key}" aria-label="Remove ${escapeHtml(label)} filter">
        ${icon("i-x")}</button></span>`);

  if (filters.search) add(`"${filters.search}"`, "search");
  if (filters.role) add(filters.role, "role");
  if (filters.country) add(filters.country, "country");
  if (filters.area) add(filters.area, "area");
  if (filters.source) add(filters.source, "source");
  if (filters.minScore > 0) add(`Match ${filters.minScore}+`, "minScore");

  $("#appliedFilters").innerHTML = pills.join("");
}

function renderList() {
  const shown = state.visible.length;
  const total = state.jobs.length;
  $("#countLine").textContent = shown === total
    ? `Showing all ${total} jobs`
    : `Showing ${shown} of ${total} jobs`;

  const list = $("#list");
  if (shown === 0) {
    list.innerHTML = `<div class="empty">${icon("i-search")}
      <h2>No jobs match</h2>
      <p>Try lowering the minimum match score, or clearing a filter.</p>
      <button class="btn" id="emptyReset">Clear all filters</button></div>`;
    $("#emptyReset").addEventListener("click", resetFilters);
    $("#loadMore").hidden = true;
    return;
  }

  // Pin the single best job above the rest on the default view.
  const spotlight = state.tab === "all" && !state.filters.search &&
                    state.sort === "priority" && shown > 0;
  const start = spotlight ? 1 : 0;
  const slice = state.visible.slice(start, start + state.page * state.perPage);
  const row = (job, top) => `
    <div class="job-row">
      <span class="flag-slot">${flagHtml(job.country, "flag")}</span>
      ${jobCard(job, top)}
    </div>`;
  list.innerHTML =
    (spotlight ? row(state.visible[0], true) : "") +
    slice.map(job => row(job, false)).join("");
  const remaining = shown - start - slice.length;
  $("#loadMore").hidden = remaining <= 0;
  $("#loadMore").textContent = `Show more (${remaining} left)`;
}

function jobCard(job, spotlight = false) {
  const strongMatch = job.score >= (state.payload.thresholds?.strong ?? 70);
  const isSaved = state.saved.has(job.id);
  const isApplied = state.applied.has(job.id);
  const verdict = verdictOf(job.id);

  const place = job.country && job.country !== "Unspecified"
    ? (job.location && job.location !== job.country ? job.location : job.country)
    : (job.location || "Location not given");

  const meta = [job.role, job.source, job.age_days != null ? postedAgo(job.age_days) : null]
    .filter(Boolean)
    .map(escapeHtml)
    .join('<span class="sep">·</span>');

  const badges = [
    spotlight ? '<span class="badge top">Top match</span>' : "",
    job.is_priority_country ? '<span class="badge canada">Canada</span>' : "",
    strongMatch ? '<span class="badge match">Strong match</span>' : "",
    job.is_new ? '<span class="badge fresh">New</span>' : "",
    job.is_government ? '<span class="badge gov">Government</span>' : "",
    // Admitted on the CV-discipline exception rather than on agriculture,
    // so say so plainly rather than letting it look like an ag match.
    job.via_discipline ? '<span class="badge disc">CV discipline</span>' : ""
  ].filter(Boolean).join("");

  const agTerms = termsFor(job, job.ag_areas);
  const techTerms = termsFor(job, job.tech_areas);
  const hasDetails = Boolean(job.summary) || agTerms.length > 0 || techTerms.length > 0;

  return `
  <article class="job${spotlight ? " spotlight" : ""}${isApplied ? " is-applied" : ""}${
      verdict === "not_fit" ? " rejected" : ""}" data-id="${job.id}">
    <div class="score${strongMatch ? " strong" : ""}" title="CV match ${Math.round(job.score)} out of 100">
      <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="ring-track" cx="24" cy="24" r="20.5"/>
        <circle class="ring-fill" cx="24" cy="24" r="20.5"
                stroke-dasharray="128.8"
                stroke-dashoffset="${(128.8 * (1 - Math.min(job.score, 100) / 100)).toFixed(1)}"/>
      </svg>
      <b class="num">${Math.round(job.score)}</b>
      <span class="sr">CV match ${Math.round(job.score)} out of 100</span>
    </div>

    <div>
      <h2><a href="${escapeHtml(job.url)}" target="_blank" rel="noopener">${escapeHtml(job.title)}</a></h2>
      <p class="org">${job.org ? `<b>${escapeHtml(job.org)}</b> · ` : ""}${escapeHtml(place)}</p>
      <p class="meta">${meta}</p>
      ${badges ? `<div class="badges">${badges}</div>` : ""}
      ${hasDetails ? `
        <button class="details-btn" data-details aria-expanded="false">
          ${icon("i-chevron")}Details</button>
        <div class="details">
          ${job.summary ? `<p>${escapeHtml(job.summary)}</p>` : ""}
          <div class="terms">
            ${agTerms.length ? `<div><b>Agriculture:</b>${escapeHtml(agTerms.join(", "))}</div>` : ""}
            ${techTerms.length ? `<div><b>Methods:</b>${escapeHtml(techTerms.join(", "))}</div>` : ""}
          </div>
        </div>` : ""}
    </div>

    <div class="actions">
      <button class="icon-btn${isSaved ? " on" : ""}" data-save
              title="${isSaved ? "Remove from saved" : "Save this job"}"
              aria-pressed="${isSaved}">
        <svg class="ic${isSaved ? " filled" : ""}" viewBox="0 0 24 24"><use href="#i-star"/></svg>
      </button>
      <button class="icon-btn${isApplied ? " done" : ""}" data-applied
              title="${isApplied ? "Mark as not applied" : "Mark as applied"}"
              aria-pressed="${isApplied}">
        ${icon("i-check")}
      </button>
      <button class="icon-btn${verdict === "fit" ? " fit" : ""}" data-fit
              title="Good fit - show me more like this"
              aria-pressed="${verdict === "fit"}">
        ${icon("i-up")}
      </button>
      <button class="icon-btn${verdict === "not_fit" ? " unfit" : ""}" data-unfit
              title="${verdict === "not_fit" ? "Put this back" : "Not a fit - hide it and learn from it"}"
              aria-pressed="${verdict === "not_fit"}">
        ${icon("i-down")}
      </button>
      <a class="btn" href="${escapeHtml(job.url)}" target="_blank" rel="noopener">
        Apply ${icon("i-external")}</a>
    </div>
  </article>`;
}

/** Matched keywords for one half of the profile, tidied for display. */
function termsFor(job, areas) {
  if (!job.matched || !areas) return [];
  return Object.entries(job.matched)
    .filter(([group]) => areas.includes(group))
    .flatMap(([, terms]) => terms)
    .slice(0, 6)
    .map(sentenceCase);
}

function postedAgo(days) {
  if (days === 0) return "Posted today";
  if (days === 1) return "Posted yesterday";
  if (days < 7) return `Posted ${days} days ago`;
  if (days < 14) return "Posted last week";
  if (days < 31) return `Posted ${Math.floor(days / 7)} weeks ago`;
  const months = Math.floor(days / 30);
  return `Posted ${months} month${months === 1 ? "" : "s"} ago`;
}

function timeAgo(iso) {
  const seconds = (Date.now() - new Date(iso)) / 1000;
  if (seconds < 90) return "just now";
  if (seconds < 3600) return `${Math.round(seconds / 60)} minutes ago`;
  if (seconds < 86400) return `${Math.round(seconds / 3600)} hours ago`;
  return `${Math.round(seconds / 86400)} days ago`;
}

/* ==========================================================================
   Interactions
   ========================================================================== */
$("#tabs").addEventListener("click", event => {
  const button = event.target.closest(".tab");
  if (!button) return;
  setActiveTab(button.dataset.tab);
  render();
});

$("#search").addEventListener("input", debounce(event => {
  state.filters.search = event.target.value.trim();
  render();
}, 200));

Object.entries({ role: "#fRole", country: "#fCountry", area: "#fArea", source: "#fSource" })
  .forEach(([key, selector]) => $(selector).addEventListener("change", event => {
    state.filters[key] = event.target.value;
    render();
  }));

$("#fScore").addEventListener("input", event => {
  state.filters.minScore = Number(event.target.value);
  $("#scoreValue").textContent = event.target.value;
  render();
});

$("#sort").addEventListener("change", event => {
  state.sort = event.target.value;
  render();
});

$("#filtersBtn").addEventListener("click", () => {
  const isOpen = $("#filters").classList.toggle("open");
  $("#filtersBtn").setAttribute("aria-expanded", String(isOpen));
});

$("#appliedFilters").addEventListener("click", event => {
  const button = event.target.closest("[data-clear]");
  if (!button) return;
  const key = button.dataset.clear;

  if (key === "minScore") {
    state.filters.minScore = 0;
    $("#fScore").value = 0;
    $("#scoreValue").textContent = "0";
  } else {
    state.filters[key] = "";
    if (FILTER_INPUTS[key]) $(FILTER_INPUTS[key]).value = "";
  }
  render();
});

$("#list").addEventListener("click", event => {
  const card = event.target.closest(".job");
  if (!card) return;
  const id = card.dataset.id;

  if (event.target.closest("[data-save]")) {
    toggleMark(state.saved, id);
    toast(state.saved.has(id) ? "Saved" : "Removed from saved");
  } else if (event.target.closest("[data-applied]")) {
    toggleMark(state.applied, id);
    toast(state.applied.has(id) ? "Marked as applied" : "Unmarked");
  } else if (event.target.closest("[data-fit]")) {
    setVerdict(id, verdictOf(id) === "fit" ? null : "fit");
  } else if (event.target.closest("[data-unfit]")) {
    const undo = verdictOf(id) === "not_fit";
    setVerdict(id, undo ? null : "not_fit");
    toast(undo ? "Back on the dashboard" : "Hidden - the ranker will learn from this");
  } else if (event.target.closest("[data-details]")) {
    const isOpen = card.classList.toggle("open");
    card.querySelector("[data-details]").setAttribute("aria-expanded", String(isOpen));
  }
});

function toggleMark(set, id) {
  if (set.has(id)) set.delete(id); else set.add(id);
  saveMarks();
  renderTabCounts();
  renderList();
}

$("#loadMore").addEventListener("click", () => {
  state.page += 1;
  renderList();
});

$("#resetBtn").addEventListener("click", resetFilters);

function resetFilters() {
  state.filters = { ...DEFAULT_FILTERS, minScore: 0 };
  Object.values(FILTER_INPUTS).forEach(selector => { $(selector).value = ""; });
  $("#fScore").value = 0;
  $("#scoreValue").textContent = "0";
  setActiveTab("all");
  render();
}

document.addEventListener("keydown", event => {
  if (event.key === "/" && document.activeElement.tagName !== "INPUT") {
    event.preventDefault();
    $("#search").focus();
  }
});

/**
 * Record a verdict. The stored record keeps the job's own features, so the
 * model can still train on it after the posting has expired off the boards.
 */
function setVerdict(id, verdict) {
  const job = state.jobs.find(j => j.id === id);
  if (!verdict) {
    delete state.feedback[id];
  } else if (job) {
    state.feedback[id] = {
      verdict,
      at: new Date().toISOString(),
      title: job.title, role: job.role, country: job.country, source: job.source,
      ag_areas: job.ag_areas || [], tech_areas: job.tech_areas || [],
      is_faculty: !!job.is_faculty, is_tenure_track: !!job.is_tenure_track,
      is_government: !!job.is_government, via_discipline: !!job.via_discipline,
      synergy: !!job.synergy
    };
  }
  saveFeedback(id, state.feedback[id] || null);
  render();
}

/**
 * Persist one rating. Only the changed record goes to the server, which
 * merges it -- sending the whole map would let a stale tab wipe ratings
 * made anywhere else.
 */
function saveFeedback(id, record) {
  localStorage.setItem("agjobs-feedback", JSON.stringify(state.feedback));
  if (state.isLive) {
    fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, record })
    }).catch(() => { /* the browser copy is still saved */ });
  }
}

async function loadFeedback() {
  let local = {};
  try { local = JSON.parse(localStorage.getItem("agjobs-feedback") || "{}"); } catch {}
  if (state.isLive) {
    try {
      const response = await fetch("/api/feedback");
      if (response.ok) return { ...local, ...(await response.json()) };
    } catch { /* fall back to the browser copy */ }
  }
  return local;
}

function saveMarks() {
  const marks = { starred: [...state.saved], applied: [...state.applied], hidden: [] };
  localStorage.setItem("agjobs-marks", JSON.stringify(marks));
  if (state.isLive) {
    fetch("/api/starred", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(marks)
    }).catch(() => {
      // The browser copy is still saved, so this is not worth surfacing.
    });
  }
}

$("#exportBtn").addEventListener("click", () => {
  if (state.visible.length === 0) {
    toast("Nothing to download");
    return;
  }
  const columns = ["score", "title", "org", "location", "country", "role",
                   "source", "posted", "salary", "url"];
  const rows = [columns.join(",")].concat(state.visible.map(job =>
    columns.map(key => `"${String(job[key] ?? "").replace(/"/g, '""')}"`).join(",")));

  const link = document.createElement("a");
  link.href = URL.createObjectURL(
    new Blob([rows.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  link.download = `agriculture-jobs-${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
  toast(`Downloaded ${state.visible.length} jobs`);
});

/* ==========================================================================
   Refresh — only available when the local engine is running
   ========================================================================== */
$("#refreshBtn").addEventListener("click", async () => {
  const button = $("#refreshBtn");
  button.disabled = true;
  $("#refreshIcon").classList.add("spin");
  $("#refreshLabel").textContent = "Searching";
  $("#statusDot").className = "dot busy";
  $("#statusText").textContent = "Searching job boards";

  try {
    const result = await (await fetch("/api/refresh", { method: "POST" })).json();
    if (!result.ok && result.reason !== "already running") throw new Error("refresh rejected");
    pollRefresh();
  } catch {
    endRefresh("Could not start the search");
  }
});

function pollRefresh() {
  clearInterval(state.pollTimer);
  state.pollTimer = setInterval(async () => {
    try {
      const progress = await (await fetch("/api/status")).json();
      const percent = progress.total ? Math.round(progress.done / progress.total * 100) : 0;
      $("#progressBar").style.width = `${percent}%`;
      $("#statusText").textContent = `Searching — ${percent}%`;

      if (!progress.running && (progress.stage === "done" || progress.stage === "error")) {
        clearInterval(state.pollTimer);
        if (progress.stage === "error") {
          endRefresh("The search failed");
          return;
        }
        state.payload = await (await fetch("/api/jobs")).json();
        state.jobs = state.payload.jobs || [];
        buildFilterOptions();
        render();
        const fresh = state.jobs.filter(job => job.is_new).length;
        endRefresh(`${state.jobs.length} jobs found, ${fresh} new`);
      }
    } catch {
      clearInterval(state.pollTimer);
      endRefresh("Lost contact with the search engine");
    }
  }, 700);
}

function endRefresh(message) {
  $("#refreshBtn").disabled = false;
  $("#refreshIcon").classList.remove("spin");
  $("#refreshLabel").textContent = "Refresh";
  $("#progressBar").style.width = "100%";
  setTimeout(() => { $("#progressBar").style.width = "0"; }, 700);
  setStatus(true);
  toast(message);
}

/* ==========================================================================
   Helpers
   ========================================================================== */
function toast(message) {
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

setInterval(() => { if (state.payload) setStatus(true); }, 60000);
init();
</script>
