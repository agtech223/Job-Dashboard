<style>
/* ============================================================
   TOKENS — an agronomic field survey.
   Ground is paper with a green bias; ink is a green-black, biased
   toward the accent rather than a defaulted grey. Survey orange is
   the single bold colour (marking tape, tractor paint); canopy green
   is reserved for match strength and never used as decoration.
   ============================================================ */
:root{
  color-scheme: light;
  --ground:#F1F3EE;
  --surface:#FFFFFF;
  --surface-2:#E9ECE4;
  --surface-3:#DFE4D8;
  --ink:#161C18;
  --ink-2:#55605A;
  --ink-3:#667065;
  --line:#DCE2D6;
  --line-2:#C6CFBE;

  --accent:#C8551B;         /* survey orange */
  --accent-solid:#A64311;   /* deeper step: solid fills carrying small white text */
  --accent-ink:#9F4315;
  --accent-wash:#FBEFE7;

  --canopy:#276742;         /* match strength */
  --canopy-wash:#EAF2EC;
  --soil:#6B4A2B;

  --good:#276742;
  --warn:#8F5E12;
  --crit:#B23A2E;

  --hero-ink:#F4F2EC;
  --hero-ground:#1B2119;

  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#10130F;
    --surface:#181C16;
    --surface-2:#20251E;
    --surface-3:#2A3027;
    --ink:#EAEEE5;
    --ink-2:#9BA598;
    --ink-3:#7E887A;
    --line:#262C23;
    --line-2:#333A2F;
    --accent:#E8763A;
    --accent-solid:#A64311;
    --accent-ink:#F08E5C;
    --accent-wash:#2A1C13;
    --canopy:#52A97A;
    --canopy-wash:#152318;
    --good:#52A97A;
    --warn:#D9A03C;
    --crit:#D9695C;
    --hero-ground:#0B0E0A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#10130F;
  --surface:#181C16;
  --surface-2:#20251E;
  --surface-3:#2A3027;
  --ink:#EAEEE5;
  --ink-2:#9BA598;
  --ink-3:#7E887A;
  --line:#262C23;
  --line-2:#333A2F;
  --accent:#E8763A;
  --accent-solid:#A64311;
  --accent-ink:#F08E5C;
  --accent-wash:#2A1C13;
  --canopy:#52A97A;
  --canopy-wash:#152318;
  --good:#52A97A;
  --warn:#D9A03C;
  --crit:#D9695C;
  --hero-ground:#0B0E0A;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--ground);color:var(--ink);
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.ic.fill{fill:currentColor;stroke:none}

.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.mono{font-family:var(--mono)}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.16em;color:var(--ink-3);
}

/* ============================================================
   MASTHEAD
   ============================================================ */
.masthead{
  border-bottom:1px solid var(--line);background:var(--ground);
  position:sticky;top:0;z-index:60;
}
.masthead-in{display:flex;align-items:center;gap:18px;height:60px}
.logo{display:flex;align-items:center;gap:11px;flex-shrink:0}
.logo-mark{
  width:34px;height:34px;display:grid;place-items:center;flex-shrink:0;
  background:var(--accent-solid);color:#fff;border-radius:3px;
}
.logo-mark svg{width:19px;height:19px;stroke-width:2}
.logo-txt strong{display:block;font-size:14px;font-weight:640;letter-spacing:-.015em;line-height:1.15}
.logo-txt span{font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3)}
.mast-sp{flex:1}
.mast-tools{display:flex;align-items:center;gap:9px;flex-shrink:0}
.sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap;
  text-transform:uppercase}
.led{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0}
.led.off{background:var(--ink-3)}
.led.live{animation:blink 1.7s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:3px;
  border:1px solid var(--line);color:var(--ink-2);transition:.15s;background:var(--surface)}
.ib:hover{border-color:var(--line-2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8.5px 15px;border-radius:3px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn-go{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
.btn-go:hover{filter:brightness(1.07)}
.btn-go:disabled{opacity:.5;cursor:not-allowed;filter:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadbar{height:2px;background:transparent}
.loadbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}

/* ============================================================
   HERO — a field report. Crop-row texture, an index legend strip
   borrowed from NDVI mapping, the headline count, and the single
   best position on the board right now.
   ============================================================ */
.hero{
  background:var(--hero-ground);color:var(--hero-ink);
  position:relative;overflow:hidden;border-bottom:1px solid var(--line);
}
.hero::before{      /* seeded rows */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.05) 0 1px, transparent 1px 34px);
  mask-image:linear-gradient(180deg,rgba(0,0,0,.85),transparent 78%);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.85),transparent 78%);
}
.hero::after{       /* headland glow, warm like low sun */
  content:"";position:absolute;right:-14%;top:-46%;width:62%;height:190%;
  background:radial-gradient(circle,rgba(200,85,27,.30),transparent 62%);
  pointer-events:none;
}
.hero-in{position:relative;z-index:1;padding:52px 0 0}
.hero-eye{color:rgba(244,242,236,.62)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);
  gap:56px;align-items:end;margin-top:20px}
.hero h1{
  font-size:clamp(38px,5.4vw,66px);line-height:.98;font-weight:660;
  letter-spacing:-.035em;text-wrap:balance;
}
.hero h1 b{color:var(--accent);font-weight:660;font-variant-numeric:tabular-nums}
.hero-sub{margin-top:20px;font-size:15px;color:rgba(244,242,236,.72);max-width:46ch;line-height:1.6}
.hero-facts{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.fact b{display:block;font-size:26px;font-weight:640;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.fact span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.13em;color:rgba(244,242,236,.5);margin-top:6px;display:block}

/* index legend strip — the NDVI ramp Hassan actually works with */
.ramp{display:flex;align-items:center;gap:12px;margin-top:34px}
.ramp-bar{height:6px;flex:1;max-width:280px;border-radius:1px;
  background:linear-gradient(90deg,#6B4A2B,#8C7A2E,#5E8F35,#2E7D51)}
.ramp span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(244,242,236,.62)}

/* featured position */
.feature{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);
  border-radius:4px;padding:20px;backdrop-filter:blur(3px);
}
.feature .eyebrow{color:rgba(244,242,236,.55);display:flex;align-items:center;gap:7px}
.feature-score{display:flex;align-items:baseline;gap:9px;margin:14px 0 10px}
.feature-score b{font-size:44px;font-weight:660;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.feature-score span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(244,242,236,.5)}
.feature h2{font-size:17px;font-weight:620;letter-spacing:-.017em;line-height:1.3}
.feature p{font-size:12.5px;color:rgba(244,242,236,.66);margin-top:7px}
.feature-go{display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  padding:9px 15px;background:var(--accent-solid);color:#fff;border-radius:3px;
  font-size:12.5px;font-weight:620;transition:.15s}
.feature-go:hover{filter:brightness(1.08)}
.feature-go svg{width:14px;height:14px}

/* ============================================================
   METER STRIP
   ============================================================ */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  margin-top:46px;border-top:1px solid rgba(255,255,255,.12);position:relative;z-index:1}
.strip .cell{padding:18px 20px 22px;border-right:1px solid rgba(255,255,255,.12)}
.strip .cell:last-child{border-right:0}
.strip .cell b{display:block;font-size:23px;font-weight:640;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.strip .cell span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.12em;color:rgba(244,242,236,.5);margin-top:7px;display:block}
.strip .cell.hot b{color:var(--accent)}

/* ============================================================
   TOOLBAR
   ============================================================ */
.toolbar{position:sticky;top:60px;z-index:50;background:var(--ground);
  border-bottom:1px solid var(--line)}
.tb-row{display:flex;align-items:center;gap:14px;padding:11px 0;flex-wrap:wrap}
.views{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.views::-webkit-scrollbar{display:none}
.vw{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:3px;
  font-size:12.5px;font-weight:550;color:var(--ink-2);white-space:nowrap;transition:.14s;
  border:1px solid transparent}
.vw:hover{background:var(--surface-2);color:var(--ink)}
.vw svg{width:14px;height:14px}
.vw i{font-style:normal;font-family:var(--mono);font-size:10.5px;
  font-variant-numeric:tabular-nums;color:var(--ink-3)}
.vw.on{background:var(--surface);border-color:var(--line-2);color:var(--ink);font-weight:640;
  box-shadow:0 1px 2px rgba(22,28,24,.05)}
.vw.on i{color:var(--accent-ink)}

.find{position:relative;width:250px;flex-shrink:0}
.find svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.find input{width:100%;padding:8px 11px 8px 34px;border-radius:3px;background:var(--surface);
  border:1px solid var(--line);font-size:12.5px;outline:none;transition:.15s}
.find input:focus{border-color:var(--accent)}
select{padding:8px 28px 8px 10px;border-radius:3px;background:var(--surface);
  border:1px solid var(--line);font-size:12.5px;outline:none;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667065' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9.5l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:13px}
select:focus{border-color:var(--accent)}

.filters{display:none;gap:12px;padding:0 0 14px;flex-wrap:wrap;align-items:center}
.filters.open{display:flex}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-3)}
.slider{display:flex;align-items:center;gap:10px}
.slider output{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent-ink);
  font-variant-numeric:tabular-nums;min-width:22px}
input[type=range]{width:130px;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--accent);margin-top:-5px}
input[type=range]::-moz-range-track{height:3px;background:var(--surface-3)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--accent)}

/* ============================================================
   CHARTS
   ============================================================ */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(292px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);margin:26px 0 0}
.panel{background:var(--surface);padding:18px 20px 20px}
.panel h3{font-size:12.5px;font-weight:640;letter-spacing:-.005em}
.panel .note{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-3);margin:5px 0 15px}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:112px 1fr 30px;align-items:center;gap:10px;font-size:11.5px}
.blab{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.btrack{height:7px;background:var(--surface-2)}
.bfill{height:100%;background:var(--canopy);transition:width .6s cubic-bezier(.2,.8,.3,1);min-width:2px}
.brow.hl .bfill{background:var(--accent)}
.brow.hl .blab{color:var(--accent-ink);font-weight:640}
.bval{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;
  text-align:right;color:var(--ink)}
.spark{width:100%;height:84px;display:block;overflow:visible}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}

/* ============================================================
   REGISTER  (the results list)
   ============================================================ */
.reg-head{display:flex;align-items:baseline;gap:14px;margin:34px 0 0;flex-wrap:wrap}
.reg-head h2{font-size:16px;font-weight:640;letter-spacing:-.015em}
.reg-head .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 7px 4px 10px;border-radius:2px;
  background:var(--accent-wash);border:1px solid var(--accent);font-size:11px;
  color:var(--accent-ink);font-weight:560}
.chip button{color:inherit;opacity:.6;display:grid;place-items:center}
.chip button:hover{opacity:1}
.chip svg{width:10px;height:10px;stroke-width:2.6}

.reg{border-top:1px solid var(--line);margin-top:14px}
.row{
  display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:20px;
  padding:20px 14px;border-bottom:1px solid var(--line);
  background:var(--surface);transition:background .14s;position:relative;
}
.row:hover{background:var(--surface-2)}
.row.done{opacity:.5}
.row.pri::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}

/* score as an instrument readout, not a dial */
.sc b{display:block;font-size:27px;font-weight:660;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums}
.sc .meter{height:3px;background:var(--surface-3);margin-top:8px}
.sc .meter i{display:block;height:100%;background:var(--canopy);
  transition:width .7s cubic-bezier(.2,.8,.3,1)}
.sc.top b{color:var(--accent)}
.sc.top .meter i{background:var(--accent)}
.sc small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);margin-top:7px}

.row h3{font-size:15.5px;font-weight:610;letter-spacing:-.017em;line-height:1.32;display:inline}
.row h3 a:hover{color:var(--accent)}
.where{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.where b{font-weight:600;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;align-items:center}
.t{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:2px;
  font-size:10.5px;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-2);white-space:nowrap}
.t svg{width:10px;height:10px}
.t.role{border-color:var(--line-2);color:var(--ink);font-weight:560}
.t.ca{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink);font-weight:620}
.t.fac{background:var(--canopy-wash);border-color:var(--canopy);color:var(--canopy);font-weight:600}
.t.syn{border-color:var(--canopy);color:var(--canopy);font-weight:600}
.t.gov{border-color:var(--warn);color:var(--warn);font-weight:600}
.t.new{background:var(--canopy);border-color:var(--canopy);color:var(--surface);font-weight:660;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em}

.terms{margin-top:11px;display:flex;flex-direction:column;gap:5px}
.tline{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tline .k{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-3);width:46px;flex-shrink:0}
.term{padding:2px 7px;font-size:10.5px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-2);border-radius:2px}
.term.ag{border-color:var(--canopy);color:var(--canopy);background:var(--canopy-wash)}

.acts{display:flex;flex-direction:column;align-items:flex-end;gap:10px;justify-content:space-between}
.icons{display:flex;gap:5px}
.ic-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:2px;
  border:1px solid var(--line);color:var(--ink-3);background:var(--surface);transition:.14s}
.ic-btn:hover{border-color:var(--line-2);color:var(--ink)}
.ic-btn.on{color:var(--warn);border-color:var(--warn)}
.ic-btn.ok{color:var(--good);border-color:var(--good)}
.ic-btn svg{width:13px;height:13px}
.apply{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:3px;
  border:1px solid var(--ink);background:var(--ink);color:var(--ground);
  font-size:12px;font-weight:620;transition:.15s;white-space:nowrap}
.apply:hover{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
.apply svg{width:13px;height:13px}
.more{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-top:11px;display:inline-flex;align-items:center;gap:5px}
.more:hover{color:var(--accent)}
.more svg{width:11px;height:11px;transition:transform .2s}
.row.open .more svg{transform:rotate(180deg)}
.desc{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line);display:none}
.row.open .desc{display:block}

.loadmore{display:block;width:100%;padding:15px;border:1px solid var(--line);border-top:0;
  background:var(--surface);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);transition:.15s}
.loadmore:hover{background:var(--surface-2);color:var(--ink)}
.blank{text-align:center;padding:76px 24px;border:1px dashed var(--line-2);background:var(--surface)}
.blank svg{width:30px;height:30px;color:var(--ink-3);margin-bottom:16px}
.blank h3{font-size:16px;font-weight:640;margin-bottom:8px}
.blank p{font-size:13px;color:var(--ink-2);max-width:44ch;margin:0 auto 18px;line-height:1.6}
.skel{height:104px;border-bottom:1px solid var(--line);background:var(--surface);
  position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(22,28,24,.04),transparent);
  animation:sweep 1.5s infinite}
@keyframes sweep{to{transform:translateX(100%)}}

.foot{border-top:1px solid var(--line);margin-top:56px;padding:26px 0 60px;
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink-3);
  display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;line-height:1.9;
  text-transform:uppercase}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:var(--ground);padding:11px 20px;border-radius:3px;
  font-size:12.5px;z-index:99;transition:transform .3s cubic-bezier(.2,.8,.3,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* entrance */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-eye,.hero h1,.hero-sub,.hero-facts,.ramp,.feature{animation:rise .6s cubic-bezier(.2,.8,.3,1) both}
.hero h1{animation-delay:.05s}
.hero-sub{animation-delay:.1s}
.hero-facts{animation-delay:.15s}
.ramp{animation-delay:.2s}
.feature{animation-delay:.12s}

@media (max-width:1000px){
  .hero-grid{grid-template-columns:1fr;gap:32px;align-items:start}
  .wrap{padding:0 22px}
}
@media (max-width:700px){
  .wrap{padding:0 16px}
  .hero-in{padding-top:36px}
  .row{grid-template-columns:60px minmax(0,1fr);gap:14px;padding:17px 12px}
  .acts{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .find{width:100%;order:5}
  .strip .cell{border-right:0;border-bottom:1px solid rgba(255,255,255,.12)}
  .foot{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-in">
    <a class="logo" href="#top">
      <span class="logo-mark"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cap-solid"/></svg></span>
      <span class="logo-txt"><strong>Field Report</strong><span>Agriculture positions</span></span>
    </a>
    <div class="mast-sp"></div>
    <div class="mast-tools">
      <span class="sync"><span class="led" id="led"></span><span id="syncTxt">Loading</span></span>
      <button class="ib" id="themeBtn" title="Switch theme" aria-label="Switch theme">
        <svg class="ic" viewBox="0 0 24 24"><use id="themeIcon" href="#i-moon"/></svg></button>
      <button class="ib" id="csvBtn" title="Export what's on screen" aria-label="Export CSV">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-download"/></svg></button>
      <button class="btn btn-go" id="refreshBtn">
        <svg class="ic" id="refreshIcon" viewBox="0 0 24 24"><use href="#i-refresh"/></svg>
        <span id="refreshLabel">Refresh</span></button>
    </div>
  </div>
  <div class="loadbar"><i id="loadbar"></i></div>
</header>

<section class="hero" id="top">
  <div class="wrap hero-in">
    <div class="eyebrow hero-eye" id="heroEye">Survey in progress</div>
    <div class="hero-grid">
      <div>
        <h1 id="heroLine">Reading the board…</h1>
        <p class="hero-sub" id="heroSub"></p>
        <div class="hero-facts" id="heroFacts"></div>
        <div class="ramp">
          <span>Weak</span><div class="ramp-bar"></div><span>Strong</span>
          <span style="margin-left:4px">CV match index</span>
        </div>
      </div>
      <div id="featureSlot"></div>
    </div>
    <div class="strip" id="strip"></div>
  </div>
</section>

<div class="toolbar">
  <div class="wrap">
    <div class="tb-row">
      <nav class="views" id="views">
        <button class="vw on" data-view="all"><svg class="ic" viewBox="0 0 24 24"><use href="#i-layers"/></svg>All<i id="vAll">0</i></button>
        <button class="vw" data-view="canada"><svg class="ic" viewBox="0 0 24 24"><use href="#i-maple"/></svg>Canada<i id="vCanada">0</i></button>
        <button class="vw" data-view="faculty"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cap"/></svg>Faculty<i id="vFaculty">0</i></button>
        <button class="vw" data-view="tenure"><svg class="ic" viewBox="0 0 24 24"><use href="#i-target"/></svg>Tenure-track<i id="vTenure">0</i></button>
        <button class="vw" data-view="niche"><svg class="ic" viewBox="0 0 24 24"><use href="#i-cpu"/></svg>Ag × Tech<i id="vNiche">0</i></button>
        <button class="vw" data-view="gov"><svg class="ic" viewBox="0 0 24 24"><use href="#i-building"/></svg>Government<i id="vGov">0</i></button>
        <button class="vw" data-view="new"><svg class="ic" viewBox="0 0 24 24"><use href="#i-clock"/></svg>New<i id="vNew">0</i></button>
        <button class="vw" data-view="starred"><svg class="ic" viewBox="0 0 24 24"><use href="#i-star"/></svg>Saved<i id="vStar">0</i></button>
      </nav>
      <div class="find">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <input type="search" id="q" placeholder="Search titles, institutions…" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn" id="filterBtn"><svg class="ic" viewBox="0 0 24 24"><use href="#i-filter"/></svg>Filters</button>
      <select id="sortBy" aria-label="Sort order">
        <option value="priority">Canada &amp; faculty first</option>
        <option value="score">Best match</option>
        <option value="new">Newest</option>
        <option value="org">Institution A–Z</option>
        <option value="country">Country A–Z</option>
      </select>
    </div>
    <div class="filters" id="filters">
      <div class="fgroup"><label for="fRole">Position</label><select id="fRole"><option value="">All</option></select></div>
      <div class="fgroup"><label for="fRegion">Region</label><select id="fRegion"><option value="">Everywhere</option></select></div>
      <div class="fgroup"><label for="fCountry">Country</label><select id="fCountry"><option value="">All</option></select></div>
      <div class="fgroup"><label for="fArea">Agriculture area</label><select id="fArea"><option value="">All</option></select></div>
      <div class="fgroup"><label for="fSource">Source</label><select id="fSource"><option value="">All</option></select></div>
      <div class="fgroup"><label for="fScore">Minimum match</label>
        <div class="slider"><input type="range" id="fScore" min="0" max="95" step="5" value="40"><output id="scoreOut">40</output></div>
      </div>
      <div class="fgroup"><label>&nbsp;</label><button class="btn" id="resetBtn">Reset all</button></div>
    </div>
  </div>
</div>

<main class="wrap">
  <section class="panels" id="panels"></section>
  <div class="reg-head"><h2 id="regTitle">Positions</h2><span class="n" id="regCount"></span></div>
  <div class="chips" id="chips"></div>
  <div class="reg" id="reg"></div>
  <button class="loadmore" id="loadMore" style="display:none">Show more</button>
  <footer class="foot">
    <span id="footL"></span>
    <span>CAUT · NRC · Nova Scotia · McGill · UBC · jobs.ac.uk · Nature · THE · Chronicle · Inside Higher Ed · HigherEdJobs · EURAXESS · jobRxiv</span>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
const S={data:null,jobs:[],view:[],page:1,per:25,live:false,
  starred:new Set(),applied:new Set(),sort:'priority',active:'all',poll:null,
  f:{q:'',role:'',region:'',country:'',area:'',source:'',score:40,
     canada:false,tenure:false,faculty:false,niche:false,gov:false,
     new:false,starred:false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=id=>`<svg class="ic" viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const FACULTY=new Set(['Tenure-Track Faculty','Professor / Senior Faculty','Lecturer / Teaching Faculty','Department Head / Chair']);
const isFac=r=>FACULTY.has(r);
const SHORT={'Agriculture, Crop & Soil Science':'Crop & soil','Agricultural / Biosystems Engineering':'Ag engineering',
 'Controlled Environment':'Controlled env.','Irrigation & Agricultural Water':'Irrigation',
 'Food Systems & Security':'Food systems','Forestry & Agroforestry':'Forestry','Precision Agriculture':'Precision ag',
 'Sensing & Remote Sensing':'Remote sensing','AI / Machine Learning':'AI & ML','Robotics & Automation':'Robotics',
 'Data Science & Modelling':'Data science','United Kingdom':'UK','United States':'USA','United Arab Emirates':'UAE'};
const short=s=>SHORT[s]||s;

/* theme */
(function(){const s=localStorage.getItem('fr-theme');
 document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 themeIcon();})();
function themeIcon(){$('#themeIcon').setAttribute('href',
  document.documentElement.dataset.theme==='dark'?'#i-moon':'#i-sun');}
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;localStorage.setItem('fr-theme',t);themeIcon();render();};

/* boot — live engine if present, else the published snapshot */
async function loadJobs(){
  try{const r=await fetch('/api/jobs',{cache:'no-store'});if(r.ok){S.live=true;return r.json();}}catch(e){}
  const r=await fetch('data/jobs.json',{cache:'no-store'});
  if(!r.ok) throw new Error('no data');
  return r.json();
}
async function loadMarks(){
  if(S.live){try{const r=await fetch('/api/starred');if(r.ok)return r.json();}catch(e){}}
  try{return JSON.parse(localStorage.getItem('fr-marks')||'{}');}catch(e){return {};}
}
async function boot(){
  $('#reg').innerHTML=Array(5).fill('<div class="skel"></div>').join('');
  try{
    S.data=await loadJobs();
    const m=await loadMarks();
    S.starred=new Set(m.starred||[]);S.applied=new Set(m.applied||[]);
    S.jobs=S.data.jobs||[];
    if(!S.live){const b=$('#refreshBtn');b.disabled=true;
      b.title='This hosted copy refreshes itself every morning';$('#refreshLabel').textContent='Auto-daily';}
    setSync(true);buildOpts();render();
    const st=S.data.stats||{};
    $('#footL').textContent=`${st.raw_fetched||0} scanned · ${st.rejected_non_ag||0} discarded as non-agricultural · ${st.total||0} kept`;
  }catch(e){setSync(false);blank();}
}
function setSync(ok){
  const l=$('#led'),t=$('#syncTxt');
  if(!ok){l.className='led off';t.textContent='No data';return;}
  l.className='led';
  t.textContent=(S.live?'Live · ':'Updated ')+(S.data?.generated_at?rel(S.data.generated_at):'now');
}
function blank(){
  $('#reg').innerHTML=`<div class="blank">${ico('i-globe')}<h3>No job data yet</h3>
    <p>Running locally? Start <b>START-DASHBOARD.bat</b> so the engine can reach the web.
       Viewing the hosted copy? The daily refresh hasn't published a snapshot yet.</p></div>`;
  $('#heroLine').textContent='No data';$('#panels').innerHTML='';$('#strip').innerHTML='';
}

/* options */
function buildOpts(){
  const cnt=k=>{const m=new Map();S.jobs.forEach(j=>{const v=j[k];if(v)m.set(v,(m.get(v)||0)+1);});
    return [...m.entries()].sort((a,b)=>b[1]-a[1]);};
  fill('#fRole',cnt('role'),'All');
  fill('#fRegion',cnt('region').filter(r=>r[0]!=='Other'),'Everywhere');
  fill('#fCountry',cnt('country').filter(c=>c[0]!=='Unspecified'),'All');
  fill('#fSource',cnt('source'),'All');
  const am=new Map();S.jobs.forEach(j=>(j.ag_areas||[]).forEach(a=>am.set(a,(am.get(a)||0)+1)));
  fill('#fArea',[...am.entries()].sort((a,b)=>b[1]-a[1]),'All');
}
const fill=(sel,e,all)=>$(sel).innerHTML=`<option value="">${all}</option>`+
  e.map(([v,n])=>`<option value="${esc(v)}">${esc(v)} (${n})</option>`).join('');

/* views */
const VIEWS={all:()=>{},canada:f=>f.canada=true,faculty:f=>f.faculty=true,tenure:f=>f.tenure=true,
  niche:f=>f.niche=true,gov:f=>f.gov=true,new:f=>f.new=true,starred:f=>f.starred=true};
const VTITLE={all:'All positions',canada:'Canadian positions',faculty:'Faculty lines',
  tenure:'Tenure-track lines',niche:'Agriculture × technology',gov:'Government positions',
  new:'New this refresh',starred:'Saved positions'};
function setView(v){
  S.active=v;
  ['canada','faculty','tenure','niche','gov','new','starred'].forEach(k=>S.f[k]=false);
  (VIEWS[v]||VIEWS.all)(S.f);
  document.querySelectorAll('.vw').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  render();
}
$('#views').addEventListener('click',e=>{const b=e.target.closest('.vw');if(b)setView(b.dataset.view);});

function compute(){
  const f=S.f,q=f.q.trim().toLowerCase();
  S.view=S.jobs.filter(j=>{
    if(j.score<f.score)return false;
    if(f.role&&j.role!==f.role)return false;
    if(f.region&&j.region!==f.region)return false;
    if(f.country&&j.country!==f.country)return false;
    if(f.source&&j.source!==f.source)return false;
    if(f.area&&!(j.ag_areas||[]).includes(f.area))return false;
    if(f.canada&&!j.is_priority_country)return false;
    if(f.tenure&&!j.is_tenure_track)return false;
    if(f.faculty&&!isFac(j.role))return false;
    if(f.niche&&!j.synergy)return false;
    if(f.gov&&!j.is_government)return false;
    if(f.new&&!j.is_new)return false;
    if(f.starred&&!S.starred.has(j.id))return false;
    if(q){const h=(j.title+' '+j.org+' '+j.location+' '+j.country+' '+
      (j.match_terms||[]).join(' ')+' '+(j.summary||'')).toLowerCase();
      if(!h.includes(q))return false;}
    return true;});
  ({priority:()=>S.view.sort((a,b)=>(a.priority??3)-(b.priority??3)||b.score-a.score),
    score:()=>S.view.sort((a,b)=>b.score-a.score),
    new:()=>S.view.sort((a,b)=>(a.age_days??999)-(b.age_days??999)||b.score-a.score),
    org:()=>S.view.sort((a,b)=>(a.org||'~').localeCompare(b.org||'~')||b.score-a.score),
    country:()=>S.view.sort((a,b)=>(a.country||'~').localeCompare(b.country||'~')||b.score-a.score)
  })[S.sort]();
}

function render(){if(!S.data)return;compute();counts();hero();panels();chips();S.page=1;rows();}

function counts(){
  const j=S.jobs;
  $('#vAll').textContent=j.length;
  $('#vCanada').textContent=j.filter(x=>x.is_priority_country).length;
  $('#vFaculty').textContent=j.filter(x=>isFac(x.role)).length;
  $('#vTenure').textContent=j.filter(x=>x.is_tenure_track).length;
  $('#vNiche').textContent=j.filter(x=>x.synergy).length;
  $('#vGov').textContent=j.filter(x=>x.is_government).length;
  $('#vNew').textContent=j.filter(x=>x.is_new).length;
  $('#vStar').textContent=S.starred.size;
}

/* hero — the count, then the single best position on the board */
function hero(){
  const j=S.jobs,st=S.data.stats||{};
  const ca=j.filter(x=>x.is_priority_country).length;
  const tt=j.filter(x=>x.is_tenure_track).length;
  const syn=j.filter(x=>x.synergy).length;
  const fresh=j.filter(x=>x.age_days!==null&&x.age_days<=7).length;
  $('#heroEye').textContent=`Field report · ${S.data.generated_at?fmtDate(S.data.generated_at):'today'}`;
  $('#heroLine').innerHTML=`<b>${j.length}</b> agriculture positions<br>worth your attention.`;
  $('#heroSub').textContent=
    `Every academic and public-sector board, read daily. ${st.rejected_non_ag||0} postings were `+
    `discarded this run for not being about agriculture — these ${j.length} were not.`;
  $('#heroFacts').innerHTML=[
    [ca,'In Canada'],[tt,'Tenure-track'],[syn,'Ag × tech'],[fresh,'Posted this week']
  ].map(([v,l])=>`<div class="fact"><b>${v}</b><span>${l}</span></div>`).join('');

  const top=[...j].sort((a,b)=>(a.priority??3)-(b.priority??3)||b.score-a.score)[0];
  $('#featureSlot').innerHTML=top?`
    <article class="feature">
      <div class="eyebrow">${ico('i-target')} Best on the board</div>
      <div class="feature-score"><b>${Math.round(top.score)}</b><span>/ 100 CV match</span></div>
      <h2><a href="${esc(top.url)}" target="_blank" rel="noopener">${esc(top.title)}</a></h2>
      <p>${esc(top.org||'Institution not stated')} · ${esc(top.country&&top.country!=='Unspecified'?top.country:(top.location||'—'))} · ${esc(top.role)}</p>
      <a class="feature-go" href="${esc(top.url)}" target="_blank" rel="noopener">View &amp; apply ${ico('i-arrow')}</a>
    </article>`:'';

  $('#strip').innerHTML=[
    [st.total??j.length,'Positions tracked',false],
    [j.filter(x=>x.priority===0).length,'Canada · faculty',true],
    [j.filter(x=>isFac(x.role)).length,'Faculty lines',false],
    [j.filter(x=>x.is_government).length,'Government',false],
    [new Set(j.map(x=>x.country).filter(c=>c&&c!=='Unspecified')).size,'Countries',false]
  ].map(([v,l,hot])=>`<div class="cell${hot?' hot':''}"><b>${v}</b><span>${l}</span></div>`).join('');
}

/* panels */
function panels(){
  const byC=tally(S.jobs.map(j=>j.country).filter(c=>c&&c!=='Unspecified'));
  byC.sort((a,b)=>(b[0]==='Canada')-(a[0]==='Canada')||b[1]-a[1]);
  const byA=tally(S.jobs.flatMap(j=>j.ag_areas||[]));
  $('#panels').innerHTML=`
    <div class="panel"><h3>Where the positions are</h3>
      <div class="note">By country · Canada pinned</div>${bars(byC.slice(0,8),'Canada')}</div>
    <div class="panel"><h3>Areas of agriculture</h3>
      <div class="note">Which part of the field</div>${bars(byA.slice(0,8))}</div>
    <div class="panel"><h3>Posting activity</h3>
      <div class="note">New per day · 30 days</div>${spark()}</div>`;
}
function tally(a){const m=new Map();a.forEach(v=>m.set(v,(m.get(v)||0)+1));
  return [...m.entries()].sort((x,y)=>y[1]-x[1]);}
function bars(e,hl){
  if(!e.length)return `<div style="font-size:12px;color:var(--ink-3);padding:14px 0">No data yet.</div>`;
  const max=Math.max(...e.map(x=>x[1]));
  return `<div class="bars">`+e.map(([l,n])=>`
    <div class="brow${l===hl?' hl':''}" title="${esc(l)}: ${n}">
      <div class="blab">${esc(short(l))}</div>
      <div class="btrack"><div class="bfill" style="width:${(n/max*100).toFixed(1)}%"></div></div>
      <div class="bval">${n}</div></div>`).join('')+`</div>`;
}
function spark(){
  const d=30,b=new Array(d).fill(0);
  S.jobs.forEach(j=>{const a=j.age_days;if(a!==null&&a>=0&&a<d)b[d-1-a]++;});
  const max=Math.max(...b,1),W=300,H=84,st=W/(d-1);
  const p=b.map((v,i)=>[i*st,H-(v/max)*(H-16)-4]);
  const line=p.map((x,i)=>(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1)).join(' ');
  const tot=b.reduce((x,y)=>x+y,0),last=p[p.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="New agriculture postings per day over 30 days, ${tot} total">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--canopy)" stop-opacity=".26"/>
      <stop offset="100%" stop-color="var(--canopy)" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" y1="${H-1}" x2="${W}" y2="${H-1}" stroke="var(--line-2)" stroke-width="1"/>
    <path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="var(--canopy)" stroke-width="1.8"
      stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"/>
    ${p.map((x,i)=>`<circle cx="${x[0].toFixed(1)}" cy="${x[1].toFixed(1)}" r="6" fill="transparent"><title>${
      d-1-i===0?'Today':(d-1-i)+' days ago'}: ${b[i]}</title></circle>`).join('')}
  </svg><div class="axis"><span>30d ago</span><span>${tot} postings</span><span>today</span></div>`;
}

/* chips */
function chips(){
  const f=S.f,c=[];
  const add=(l,k)=>c.push(`<span class="chip">${esc(l)}<button data-clear="${k}" aria-label="Clear ${esc(l)}">${ico('i-x')}</button></span>`);
  if(f.q)add(`“${f.q}”`,'q');
  ['role','region','country','area','source'].forEach(k=>{if(f[k])add(f[k],k);});
  if(f.score>0)add(`Match ≥ ${f.score}`,'score');
  $('#chips').innerHTML=c.join('');
}

/* register */
function rows(){
  const n=S.view.length,t=S.jobs.length;
  $('#regTitle').textContent=VTITLE[S.active]||'Positions';
  $('#regCount').textContent=n===t?`${n} shown`:`${n} of ${t}`;
  const el=$('#reg');
  if(!n){
    el.innerHTML=`<div class="blank">${ico('i-search')}<h3>Nothing matches these filters</h3>
      <p>Lower the minimum match, clear the country, or go back to <b>All</b>. Everything here is
         agriculture-related by design — non-agricultural postings never reach this page.</p>
      <button class="btn" onclick="resetAll()">Reset all</button></div>`;
    $('#loadMore').style.display='none';return;
  }
  const slice=S.view.slice(0,S.page*S.per);
  el.innerHTML=slice.map(row).join('');
  $('#loadMore').style.display=slice.length<n?'block':'none';
  $('#loadMore').textContent=`Show more — ${n-slice.length} remaining`;
}
function row(j){
  const th=S.data.thresholds||{strong:70};
  const star=S.starred.has(j.id),done=S.applied.has(j.id);
  const loc=j.country&&j.country!=='Unspecified'
    ? (j.location&&j.location!==j.country?j.location:j.country):(j.location||'Location not stated');
  const cap=t=>t.replace(/^\w/,m=>m.toUpperCase());
  const ag=j.matched?Object.entries(j.matched).filter(([g])=>(j.ag_areas||[]).includes(g)).flatMap(([,v])=>v):[];
  const tech=j.matched?Object.entries(j.matched).filter(([g])=>(j.tech_areas||[]).includes(g)).flatMap(([,v])=>v):[];
  const also=(j.also_on||[]).length;
  return `
  <article class="row ${done?'done':''} ${j.priority===0?'pri':''}" data-id="${j.id}">
    <div class="sc ${j.score>=th.strong?'top':''}">
      <b>${Math.round(j.score)}</b>
      <div class="meter"><i style="width:${Math.min(j.score,100).toFixed(0)}%"></i></div>
      <small>match</small>
    </div>
    <div>
      <h3><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
      <div class="where">${j.org?`<b>${esc(j.org)}</b> · `:''}${esc(loc)}</div>
      <div class="tags">
        <span class="t role">${esc(j.role)}</span>
        ${j.is_priority_country?`<span class="t ca">${ico('i-maple')}Canada</span>`:''}
        ${j.is_faculty?`<span class="t fac">Faculty line</span>`:''}
        ${j.synergy?`<span class="t syn">${ico('i-cpu')}Ag × Tech</span>`:''}
        ${j.is_government?`<span class="t gov">${ico('i-building')}Government</span>`:''}
        ${j.is_new?`<span class="t new">NEW</span>`:''}
        ${j.country&&j.country!=='Unspecified'&&!j.is_priority_country?`<span class="t">${ico('i-globe')}${esc(j.country)}</span>`:''}
        <span class="t">${esc(j.source)}${also?` +${also}`:''}</span>
        ${j.age_days!=null?`<span class="t">${age(j.age_days)}</span>`:''}
        ${j.salary?`<span class="t">${esc(j.salary)}</span>`:''}
      </div>
      <div class="terms">
        ${ag.length?`<div class="tline"><span class="k">Ag</span>${ag.slice(0,5).map(t=>`<span class="term ag">${esc(cap(t))}</span>`).join('')}</div>`:''}
        ${tech.length?`<div class="tline"><span class="k">Tools</span>${tech.slice(0,5).map(t=>`<span class="term">${esc(cap(t))}</span>`).join('')}</div>`:''}
      </div>
      ${j.summary?`<button class="more" data-more>${ico('i-chevron')}Details</button><div class="desc">${esc(j.summary)}</div>`:''}
    </div>
    <div class="acts">
      <div class="icons">
        <button class="ic-btn ${star?'on':''}" data-star title="${star?'Remove from saved':'Save'}">
          <svg class="ic ${star?'fill':''}" viewBox="0 0 24 24"><use href="#i-star"/></svg></button>
        <button class="ic-btn ${done?'ok':''}" data-done title="${done?'Mark not applied':'Mark as applied'}">
          ${ico('i-check')}</button>
      </div>
      <a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply ${ico('i-arrow')}</a>
    </div>
  </article>`;
}
function age(d){if(d===0)return'Today';if(d===1)return'Yesterday';if(d<7)return d+' days ago';
  if(d<14)return'Last week';if(d<31)return Math.floor(d/7)+' weeks ago';
  return Math.floor(d/30)+' month'+(d<60?'':'s')+' ago';}
function rel(iso){const s=(Date.now()-new Date(iso))/1000;
  if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString(undefined,
  {day:'numeric',month:'long',year:'numeric'});}catch(e){return'today';}}

/* events */
$('#q').addEventListener('input',deb(e=>{S.f.q=e.target.value;render();},220));
[['fRole','role'],['fRegion','region'],['fCountry','country'],['fArea','area'],['fSource','source']]
  .forEach(([id,k])=>$('#'+id).addEventListener('change',e=>{S.f[k]=e.target.value;render();}));
$('#fScore').addEventListener('input',e=>{S.f.score=+e.target.value;$('#scoreOut').textContent=e.target.value;render();});
$('#sortBy').addEventListener('change',e=>{S.sort=e.target.value;render();});
$('#filterBtn').onclick=()=>$('#filters').classList.toggle('open');
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('[data-clear]');if(!b)return;const k=b.dataset.clear;
  if(k==='score'){S.f.score=0;$('#fScore').value=0;$('#scoreOut').textContent='0';}
  else{S.f[k]='';const m={q:'#q',role:'#fRole',region:'#fRegion',country:'#fCountry',area:'#fArea',source:'#fSource'};
    if(m[k])$(m[k]).value='';}
  render();});
$('#reg').addEventListener('click',e=>{
  const a=e.target.closest('.row');if(!a)return;const id=a.dataset.id;
  if(e.target.closest('[data-star]')){S.starred.has(id)?S.starred.delete(id):S.starred.add(id);
    save();counts();rows();toast(S.starred.has(id)?'Saved':'Removed from saved');}
  else if(e.target.closest('[data-done]')){S.applied.has(id)?S.applied.delete(id):S.applied.add(id);
    save();counts();rows();toast(S.applied.has(id)?'Marked as applied':'Unmarked');}
  else if(e.target.closest('[data-more]'))a.classList.toggle('open');});
$('#loadMore').onclick=()=>{S.page++;rows();};
$('#resetBtn').onclick=resetAll;
function resetAll(){
  S.f={q:'',role:'',region:'',country:'',area:'',source:'',score:0,
    canada:false,tenure:false,faculty:false,niche:false,gov:false,new:false,starred:false};
  ['#q','#fRole','#fRegion','#fCountry','#fArea','#fSource'].forEach(s=>$(s).value='');
  $('#fScore').value=0;$('#scoreOut').textContent='0';setView('all');
}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'&&document.activeElement===$('#q'))$('#q').blur();});
function save(){
  const p={starred:[...S.starred],applied:[...S.applied],hidden:[]};
  localStorage.setItem('fr-marks',JSON.stringify(p));
  if(S.live)fetch('/api/starred',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(p)}).catch(()=>{});
}
$('#csvBtn').onclick=()=>{
  if(!S.view.length)return toast('Nothing to export');
  const c=['score','title','org','location','country','role','source','posted','salary','url'];
  const rows=[c.join(',')].concat(S.view.map(j=>c.map(k=>`"${String(j[k]??'').replace(/"/g,'""')}"`).join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`agriculture-positions-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();URL.revokeObjectURL(a.href);toast(`Exported ${S.view.length} positions`);};

/* refresh */
$('#refreshBtn').onclick=async()=>{
  const b=$('#refreshBtn');b.disabled=true;
  $('#refreshIcon').classList.add('spin');$('#refreshLabel').textContent='Searching';
  $('#led').className='led live';$('#syncTxt').textContent='Fetching';
  try{const r=await(await fetch('/api/refresh',{method:'POST'})).json();
    if(!r.ok&&r.reason!=='already running')throw new Error('failed');
    poll();}catch(e){endRefresh('Refresh failed');}};
function poll(){
  clearInterval(S.poll);
  S.poll=setInterval(async()=>{
    try{const p=await(await fetch('/api/status')).json();
      const pct=p.total?Math.round(p.done/p.total*100):0;
      $('#loadbar').style.width=pct+'%';$('#syncTxt').textContent=pct+'% scanned';
      if(!p.running&&(p.stage==='done'||p.stage==='error')){
        clearInterval(S.poll);
        if(p.stage==='error')return endRefresh('Refresh failed');
        S.data=await(await fetch('/api/jobs')).json();S.jobs=S.data.jobs||[];
        buildOpts();render();
        endRefresh(`${S.jobs.length} positions · ${S.jobs.filter(x=>x.is_new).length} new`);
      }}catch(e){clearInterval(S.poll);endRefresh('Lost contact with the engine');}},700);
}
function endRefresh(m){
  $('#refreshBtn').disabled=false;$('#refreshIcon').classList.remove('spin');
  $('#refreshLabel').textContent='Refresh';$('#loadbar').style.width='100%';
  setTimeout(()=>$('#loadbar').style.width='0',800);setSync(true);toast(m);
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
function deb(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

setInterval(()=>{if(S.data)setSync(true);},60000);
boot();
</script>
</body>
</html>
